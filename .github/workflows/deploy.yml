name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
  # Validate (but don't deploy) pull requests targeting main.
  pull_request:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:
  # Daily rebuild so newly-added/updated Etsy listings appear on the site.
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check (astro check)
        # @astrojs/check + typescript are installed ad hoc (not pinned in the
        # lockfile) so `npm ci` stays reproducible for the build/deploy jobs.
        run: |
          npm install --no-save @astrojs/check typescript
          npx astro check
      - name: Dependency audit (report only)
        # Informational: the Astrofy template ships known-vulnerable transitive
        # deps. Surface them without blocking deploys; clear them in a dedicated
        # dependency-modernization pass (tracked in the pmo plan).
        continue-on-error: true
        run: npm audit --audit-level=high

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Sync Etsy listings (skips if not configured)
        shell: pwsh
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHOP_NAME: ${{ vars.ETSY_SHOP_NAME }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ETSY_API_KEY) -or [string]::IsNullOrWhiteSpace($env:ETSY_SHOP_NAME)) {
            Write-Host "ETSY_API_KEY / ETSY_SHOP_NAME not set — skipping Etsy sync; store shows existing content."
            exit 0
          }
          ./scripts/Sync-EtsyListings.ps1
      - name: Build and upload your site
        uses: withastro/action@v3
        with:
          package-manager: npm@latest

  deploy:
    needs: build
    # Never deploy from a pull request — only on push to main / manual / schedule.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4