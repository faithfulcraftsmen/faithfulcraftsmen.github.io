<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Realistic style: wood train engine with cab, boiler, and smokestack -->
  <!-- Train base -->
  <rect x="4" y="20" width="20" height="5" rx="2" fill="#E5C99A" stroke="#8B5C2A" stroke-width="1.5"/>
  <!-- Cab -->
  <rect x="6" y="14" width="6" height="8" rx="1.5" fill="#E5C99A" stroke="#8B5C2A" stroke-width="1.5"/>
  <!-- Boiler -->
  <rect x="13" y="16" width="7" height="6" rx="2" fill="#E5C99A" stroke="#8B5C2A" stroke-width="1.5"/>
  <!-- Smokestack -->
  <rect x="17" y="12" width="2" height="4" rx="0.7" fill="#C2A477" stroke="#8B5C2A" stroke-width="1"/>
  <!-- Wheels -->
  <circle cx="8" cy="26" r="1.5" fill="#C2A477" stroke="#8B5C2A" stroke-width="1"/>
  <circle cx="14" cy="26" r="1.5" fill="#C2A477" stroke="#8B5C2A" stroke-width="1"/>
  <circle cx="20" cy="26" r="1.5" fill="#C2A477" stroke="#8B5C2A" stroke-width="1"/>
</svg>
